name: CI

on:
  push:
    branches: [master]
    paths-ignore: ["contrib/sigs/**"]
  pull_request:
    branches: [master]
    # Attestation PRs add signed manifests and nothing else; rebuilding the
    # whole matrix to review two text files is pure waste.
    paths-ignore: ["contrib/sigs/**"]
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  workflow_dispatch:

jobs:
  nix-sanity-check:
    name: Nix Sanity Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - uses: cachix/cachix-action@v17
        with:
          name: floresta-flake
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: ${{ github.event_name == 'pull_request' }}

      - name: Nix flake check
        run: nix flake check -L

      - name: Verify consumer integration
        run: nix flake check ./examples -L --no-build

  service-tests:
    name: Service Module Tests
    needs: nix-sanity-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - uses: cachix/cachix-action@v17
        with:
          name: floresta-flake
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: ${{ github.event_name == 'pull_request' }}

      - name: Run eval tests
        run: nix build -L .#checks.x86_64-linux.service-eval-test

      - name: Run VM integration test
        run: nix build -L .#checks.x86_64-linux.service-vm-test

  build:
    name: ${{ matrix.package }} (${{ matrix.system }})
    needs: nix-sanity-check
    strategy:
      fail-fast: false
      matrix:
        # One build of the workspace is the whole release, so there is
        # nothing to split across jobs.
        package: [master]
        system: [x86_64-linux, x86_64-darwin, aarch64-linux, aarch64-darwin]
    runs-on: >-
      ${{
        contains(matrix.system, 'darwin') && 'macos-14' ||
        matrix.system == 'aarch64-linux' && 'ubuntu-24.04-arm' ||
        'ubuntu-latest'
      }}
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - uses: cachix/cachix-action@v17
        with:
          name: floresta-flake
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: ${{ github.event_name == 'pull_request' }}

      - name: Build ${{ matrix.package }}
        run: nix build -L .#${{ matrix.package }}
